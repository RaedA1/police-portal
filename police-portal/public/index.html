<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<title>Department Portal</title>
<style>
@property --ac{syntax:'<color>';inherits:true;initial-value:#8fa3ba}
@property --ac2{syntax:'<color>';inherits:true;initial-value:#3d4b5c}
:root{--bg:#050b1a;--bg2:#0a1530;--pan:#0c1a36;--line:#1c3160;--tx:#eef1f7;--mu:#93a1bb;--ok:#4fb477;--bad:#d9534f;
--ac:#e8cf55;--ac2:#14306e;transition:--ac .9s ease,--ac2 .9s ease;
font-family:"Bahnschrift","Segoe UI",Tahoma,"Helvetica Neue",Arial,sans-serif}
[data-theme=academy]{--ac:#d64550;--ac2:#5a1a20}
[data-theme=affairs]{--ac:#3f8cff;--ac2:#14305c}
[data-theme=wings]{--ac:#d4a93c;--ac2:#1a2a5c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;line-height:1.55}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
radial-gradient(900px 500px at 80% -10%,color-mix(in srgb,var(--ac) 22%,transparent),transparent),
repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,255,255,.015) 22px 23px),var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:border-color .9s}
.bar{max-width:1100px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo img{width:38px;height:38px;border-radius:50%}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 14px;text-decoration:none;color:var(--mu);border-bottom:2px solid transparent;transition:.3s}
nav a:hover,nav a.on{color:var(--tx);border-color:var(--ac)}
main{flex:1;width:100%;max-width:1100px;margin:auto;padding:28px 20px 48px;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.08;letter-spacing:-.01em}
h2{font-size:1.5rem;margin-bottom:14px}h3{font-size:1.05rem}
p.lead{color:var(--mu);max-width:62ch;margin:16px 0 26px}
.hero{padding:40px 0 30px;border-inline-start:3px solid var(--ac);padding-inline-start:24px;transition:border-color .9s}
.btn{display:inline-block;background:var(--ac);color:#0a0e14;font-weight:700;border:0;padding:10px 20px;cursor:pointer;text-decoration:none;font:inherit;font-weight:700;border-radius:3px;transition:background .9s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:.85rem}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--pan);border:1px solid var(--line);border-radius:6px;padding:18px;transition:border-color .9s,box-shadow .9s,transform .3s}
.card.hl{border-color:var(--ac);box-shadow:0 0 24px -8px var(--ac)}
.ico{color:var(--ac);font-size:1.4rem;transition:color .9s}
.mu{color:var(--mu)}
.badge{display:inline-block;font-size:.78rem;padding:2px 9px;border:1px solid var(--ac);color:var(--ac);border-radius:20px;transition:.9s}
.layout{display:grid;grid-template-columns:260px 1fr;gap:20px}
.ranks{display:flex;flex-direction:column;gap:0}
.rk{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--pan);border:1px solid var(--line);border-radius:6px;margin-bottom:22px;position:relative;transition:.3s}
.rk:not(:last-child)::after{content:"";position:absolute;inset-inline-start:26px;top:100%;height:22px;width:2px;background:var(--line)}
.rk:hover{border-color:var(--ac)}
.rk[aria-pressed=true]{border-color:var(--ac);box-shadow:0 0 18px -6px var(--ac);background:color-mix(in srgb,var(--ac2) 40%,var(--pan))}
.rk b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ac2);font-size:.8rem}
.rk.off{opacity:.45}
.req{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:16px}
.big{font-size:1.9rem;font-weight:700}
.prog{height:6px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.prog>div{height:100%;background:var(--ac);width:0;transition:width .5s,background .9s}
.wings{list-style:none;padding:0;display:grid;gap:6px}
.wings label{display:flex;gap:8px;align-items:center;cursor:pointer}
input,select{font:inherit;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%}
input[type=checkbox]{width:auto;accent-color:var(--ac)}
label.f{display:block;font-size:.85rem;color:var(--mu)}
label.f input,label.f select{margin-top:4px;color:var(--tx)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.err{color:var(--bad);font-size:.82rem;min-height:1em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:start;padding:8px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--mu);font-weight:600}
.sw{overflow-x:auto}
@media(max-width:720px){
.layout{grid-template-columns:1fr}
.tbl thead{display:none}.tbl tr{display:block;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;padding:6px}
.tbl td{display:flex;justify-content:space-between;gap:10px;border:0}
.tbl td::before{content:attr(data-l);color:var(--mu)}}
footer{border-top:2px solid var(--ac);text-align:center;padding:30px 20px;background:linear-gradient(180deg,color-mix(in srgb,var(--ac2) 45%,transparent),transparent);transition:border-color .9s}
footer strong{display:inline-block;direction:ltr;unicode-bidi:isolate;font-size:clamp(.95rem,3.4vw,1.2rem);letter-spacing:.03em;color:var(--ac);transition:color .9s}
footer .sep{margin:0 1.1em;opacity:.6}
#toast{position:fixed;inset-inline-end:16px;bottom:16px;z-index:50;display:grid;gap:8px}
.t{background:var(--pan);border-inline-start:4px solid var(--ok);padding:10px 16px;border-radius:4px;box-shadow:0 6px 20px #0008;animation:in .3s}
.t.e{border-color:var(--bad)}
dialog{background:var(--pan);color:var(--tx);border:1px solid var(--ac);border-radius:6px;padding:22px;max-width:92vw}
dialog::backdrop{background:#000a}
[dir=rtl] .logo,[dir=rtl] h1{letter-spacing:0}
.logo img{animation:beat 3s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.1);filter:drop-shadow(0 0 8px var(--ac))}}
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-block:0;width:40%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac) 14%,transparent),transparent);animation:scan 5s linear infinite;pointer-events:none}
@keyframes scan{from{inset-inline-start:-40%}to{inset-inline-start:110%}}
.rise>*{animation:in .6s both;animation-delay:calc(var(--i,0)*80ms)}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff5 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn:hover::after{transform:translateX(120%)}
.card:hover{transform:translateY(-3px)}
.card.hl{animation:glow 3.5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 34px -6px var(--ac)}}
.prog>div{background-image:linear-gradient(90deg,transparent,#fff4,transparent);background-size:60px 100%;background-repeat:no-repeat;animation:sh 2s linear infinite}
@keyframes sh{from{background-position:-60px 0}to{background-position:200px 0}}
.rk:hover{transform:translateX(4px)}[dir=rtl] .rk:hover{transform:translateX(-4px)}
.seal{position:absolute;inset-inline-end:3%;top:50%;width:min(250px,30%);translate:0 -50%;animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 12px 28px #000c)}
@keyframes fl{50%{translate:0 calc(-50% - 10px)}}
.hero h1,.hero .lead{max-width:calc(100% - 280px)}
@media(max-width:720px){.seal{position:static;display:block;width:130px;translate:none;animation:none;margin-bottom:14px}.hero h1,.hero .lead{max-width:none}}
.dcards{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.dc{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;min-height:270px;padding:28px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(155deg,color-mix(in srgb,var(--dcol) 32%,#050b1a),#050b1a 80%);display:flex;flex-direction:column;justify-content:flex-end;gap:6px;transition:transform .3s,border-color .5s,box-shadow .5s}
.dc[data-d=academy]{--dcol:#d64550}.dc[data-d=affairs]{--dcol:#3f8cff}.dc[data-d=wings]{--dcol:#d4a93c}
.dc:hover{transform:translateY(-4px);border-color:var(--dcol)}
.dc:focus-visible{outline:2px solid var(--dcol);outline-offset:3px}
.dc.on{border-color:var(--dcol);box-shadow:0 0 0 1px var(--dcol),0 18px 46px -16px var(--dcol)}
.dc .emb{position:absolute;inset-block-start:22px;inset-inline-end:22px;width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 8px 18px #000a);transition:transform .5s}
.dc:hover .emb{transform:scale(1.06) rotate(-2deg)}
.oi{width:46px;height:46px;object-fit:contain;vertical-align:middle;margin-inline-end:12px}
.dc h1{font-size:2.3rem}.dc p{color:var(--mu)}
.dc::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--dcol)}
.org{margin-top:26px;padding:24px;border-radius:10px;border:1px solid var(--ac);background:linear-gradient(180deg,color-mix(in srgb,var(--ac2) 55%,var(--pan)),var(--pan));box-shadow:0 20px 60px -30px var(--ac);transition:border-color .9s,box-shadow .9s;animation:in .5s}
.org h2{margin-bottom:22px}
.pc{display:flex;gap:16px;align-items:center;padding:18px;border-radius:8px;background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px solid var(--line);border-inline-start:4px solid var(--ac);transition:border-color .9s}
.pc.top,.pc.mid{position:relative;max-width:520px;margin:0 auto;padding:24px}
.pc.mid{margin-top:34px}
.pc.top::after,.pc.mid::after{content:"";position:absolute;left:50%;top:100%;height:17px;border-inline-start:2px solid var(--line)}
.pav{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;color:var(--ac);border:2px solid var(--ac);background:var(--ac2);transition:color .9s,border-color .9s,background .9s}
.pc h3{font-size:1.3rem}.pc.top h3{font-size:1.6rem}
.orow{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));margin-top:34px;position:relative}
.orow::before{content:"";position:absolute;inset-inline:25%;top:-17px;height:17px;border:2px solid var(--line);border-bottom:0}
@media(max-width:720px){.orow::before{display:none}.pc.top::after,.pc.mid::after{display:none}.orow{margin-top:16px}}
.dc{border-radius:90px;align-items:center;justify-content:center;text-align:center;min-height:300px;padding:40px 36px;gap:8px}
.dc::after{display:none}
.dc .emb{position:static;width:120px;height:120px}
.dc h1{font-size:2rem}
.drow{display:grid;grid-template-columns:minmax(150px,1fr) 2fr;gap:8px 14px;align-items:center;margin-top:12px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:720px){.dc{padding:40px 34px;min-height:300px}.drow{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
$("#go").onclick=async()=>{const until=+sessionStorage.getItem("u")||0;
if(Date.now()<until)return $("#pe").textContent="Too many attempts. Wait "+Math.ceil((until-Date.now())/1000)+"s.";
const h=await hash($("#pw").value,new Uint8Array(ADMIN.s));
if(h===ADMIN.h){authed=true;sessionStorage.removeItem("f");audit("Admin signed in");adminUI()}
else{const n=(+sessionStorage.getItem("f")||0)+1;sessionStorage.setItem("f",n);if(n>=5)sessionStorage.setItem("u",Date.now()+60000*Math.min(n-4,15));$("#pe").textContent="Incorrect password."}}}
function adminUI(){
app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h2>Admin Panel</h2><button class="btn ghost sm" id="lo">Sign out</button></div>
<div class="tabs">${[["ranks","Ranks"],["wings","Wings"],["depts","Departments"],["news","Announcements"],["backup","Backup"],["log","Audit log"]].map(t=>`<button class="btn ${tab===t[0]?"":"ghost"} sm" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div><div id="tb"></div>`;
$("#lo").onclick=()=>{authed=false;audit("Admin signed out");location.hash="#home"};
app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;adminUI()});
({ranks:tRanks,wings:tWings,depts:tDepts,news:tNews,backup:tBackup,log:tLog}[tab])()}
function tRanks(){
$("#tb").innerHTML=`<button class="btn sm" id="add">Add rank</button><div class="sw card" style="margin-top:12px"><table class="tbl"><thead><tr><th>Order</th><th>Rank</th><th>MDT</th><th>Dispatch</th><th>Presence</th><th>Shift</th><th>Wings</th><th>On</th><th></th></tr></thead><tbody>
${DB.ranks.map((x,i)=>`<tr><td data-l="Order">${i+1}</td><td data-l="Rank">${esc(x.name)}</td><td data-l="MDT">${x.mdt}</td><td data-l="Dispatch">${x.dispatch}</td><td data-l="Presence">${x.presence}</td><td data-l="Shift">${x.shift}${x.shiftDone?" ✔":""}</td><td data-l="Wings">${x.wings.includes("*")?"ALL":x.wings.length}</td><td data-l="Active">${x.active?"Yes":"No"}</td>
<td><button class="btn ghost sm" data-e="${i}">Edit</button> <button class="btn ghost sm" data-u="${i}" aria-label="Move up">↑</button> <button class="btn danger sm" data-x="${i}">Delete</button></td></tr>`).join("")}</tbody></table></div><div id="ed"></div>`;
$("#add").onclick=()=>rankForm(-1);
app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>rankForm(+b.dataset.e));
app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const i=+b.dataset.u;if(i<1)return;[DB.ranks[i-1],DB.ranks[i]]=[DB.ranks[i],DB.ranks[i-1]];save();audit("Reordered ranks");tRanks()});
app.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.x;if(DB.ranks.length<2)return toast("At least one rank is required",1);
if(await confirmD(`Delete rank "${DB.ranks[i].name}"?`)){audit("Deleted rank "+DB.ranks[i].name);DB.ranks.splice(i,1);save();toast("Rank deleted");tRanks()}})}
function rankForm(i){
const x=i<0?{name:"",mdt:0,dispatch:0,presence:0,shift:0,shiftDone:0,wings:[],active:1}:DB.ranks[i];
const n=(id,l)=>`<label class="f">${l}<input id="${id}" type="number" min="0" max="999" step="1" value="${x[id]}"></label>`;
$("#ed").innerHTML=`<div class="card hl" style="margin-top:14px"><h3>${i<0?"Add rank":"<span>Edit</span> "+esc(x.name)}</h3><div class="form" style="margin-top:12px">
<label class="f">Rank name<input id="name" maxlength="40" value="${esc(x.name)}"></label>${n("mdt","MDT registrations")}${n("dispatch","Dispatch hours")}${n("presence","Weekly presence (h)")}${n("shift","Shift responsibility (h)")}</div>
<label class="f" style="margin-top:12px"><input type="checkbox" id="sd" ${x.shiftDone?"checked":""}> Must take a responsibility (e.g. wing lead)</label>
<label class="f"><input type="checkbox" id="ac" ${x.active?"checked":""}> Requirement enabled</label>
<label class="f"><input type="checkbox" id="all" ${x.wings.includes("*")?"checked":""}> All wings required</label>
<div class="wings" style="margin-top:8px">${DB.wings.map(w=>`<label><input type="checkbox" class="wc" value="${esc(w)}" ${x.wings.includes(w)?"checked":""}> <bdi translate="no">${esc(w)}</bdi></label>`).join("")}</div>
<div class="err" id="fe"></div><button class="btn" id="sv">Save</button> <button class="btn ghost" id="cn">Cancel</button></div>`;
$("#cn").onclick=()=>$("#ed").innerHTML="";
$("#sv").onclick=()=>{const name=clean($("#name").value),v={};let bad="";
["mdt","dispatch","presence","shift"].forEach(k=>{const raw=$("#"+k).value;const num=Number(raw);if(raw===""||!Number.isInteger(num)||num<0||num>999)bad="Values must be whole numbers from 0 to 999.";v[k]=num});
if(!name)bad="Rank name is required.";
if(DB.ranks.some((r,j)=>j!==i&&r.name.toLowerCase()===name.toLowerCase()))bad="This rank already exists.";
const ws=$("#all").checked?["*"]:[...document.querySelectorAll(".wc:checked")].map(c=>c.value).filter(w=>DB.wings.includes(w));
if(bad)return $("#fe").textContent=bad;
const o={name,...v,shiftDone:$("#sd").checked?1:0,active:$("#ac").checked?1:0,wings:ws};
if(i<0)DB.ranks.push(o);else DB.ranks[i]=o;save();audit((i<0?"Added":"Edited")+" rank "+name);toast("Saved");tRanks()}}
function tWings(){
$("#tb").innerHTML=`<div class="card"><div class="form"><label class="f">New wing name<input id="nw" maxlength="40"></label></div><div class="err" id="we"></div><button class="btn sm" id="aw">Add wing</button>
<table class="tbl" style="margin-top:14px"><tbody>${DB.wings.map((w,i)=>`<tr><td data-l="Wing"><bdi translate="no">${esc(w)}</bdi></td><td><button class="btn ghost sm" data-r="${i}">Rename</button> <button class="btn danger sm" data-x="${i}">Delete</button></td></tr>`).join("")}</tbody></table></div>`;
const ok=(name,skip)=>!name?"Wing name is required.":DB.wings.some((w,j)=>j!==skip&&w.toLowerCase()===name.toLowerCase())?"This wing already exists.":name==="*"?"Invalid wing name.":"";
$("#aw").onclick=()=>{const n=clean($("#nw").value),e=ok(n,-1);if(e)return $("#we").textContent=e;DB.wings.push(n);save();audit("Added wing "+n);toast("Wing added");tWings()};
app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const i=+b.dataset.r,old=DB.wings[i],n=clean(prompt(T("New name"),old)||""),e=n&&n!==old?ok(n,i):(n?"":"Cancelled");
if(e)return e!=="Cancelled"&&toast(e,1);if(!n||n===old)return;DB.wings[i]=n;DB.ranks.forEach(r=>r.wings=r.wings.map(w=>w===old?n:w));save();audit("Renamed wing "+old);toast("Wing renamed");tWings()});
app.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.x,w=DB.wings[i];if(await confirmD(`Delete wing "${w}"? It is removed from all ranks.`)){DB.wings.splice(i,1);DB.ranks.forEach(r=>r.wings=r.wings.filter(x=>x!==w));save();audit("Deleted wing "+w);toast("Wing deleted");tWings()}})}
function collect(k){const d=DB.depts[k];
app.querySelectorAll(`[data-k="${k}"]`).forEach(i=>d[i.dataset.f]=clean(i.value));
d.mgmtList=[...app.querySelectorAll(`[data-mk="${k}"][data-mf="n"]`)].map(n=>({n:clean(n.value),u:clean(app.querySelector(`[data-mk="${k}"][data-mf="u"][data-mi="${n.dataset.mi}"]`).value)}))}
function tDepts(){
const inp=(a,ph,v)=>`<input ${a} maxlength="80" placeholder="${ph}" aria-label="${ph}" value="${esc(v)}">`;
const row=(lab,a,b,x)=>`<div class="drow"><div class="mu" translate="no">${lab}</div><div class="form2">${inp(a,"Name",x[0])}${inp(b,"UNIT",x[1])}</div></div>`;
$("#tb").innerHTML=Object.entries(DB.depts).map(([k,d])=>`<div class="card" style="margin-bottom:14px"><h3>${esc(d.title)}</h3>
${row(ROLES[k][0],`data-k="${k}" data-f="cmd"`,`data-k="${k}" data-f="cmdUnit"`,[d.cmd,d.cmdUnit])}
${row(ROLES[k][1],`data-k="${k}" data-f="dep"`,`data-k="${k}" data-f="depUnit"`,[d.dep,d.depUnit])}
${(d.mgmtList||[]).map((m,i)=>row(ROLES[k][2],`data-mk="${k}" data-mf="n" data-mi="${i}"`,`data-mk="${k}" data-mf="u" data-mi="${i}"`,[m.n,m.u])+(d.mgmtList.length>1?`<div style="text-align:end;margin-top:6px"><button class="btn danger sm" data-dm="${k}:${i}">Delete</button></div>`:"")).join("")}
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">${ROLES[k][2]?`<button class="btn ghost sm" data-am="${k}">Add Management</button>`:""}<button class="btn sm" data-s="${k}">Save ${esc(d.title)}</button></div></div>`).join("");
app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const k=b.dataset.s;collect(k);save();audit("Updated department "+k);toast("Saved")});
app.querySelectorAll("[data-am]").forEach(b=>b.onclick=()=>{const k=b.dataset.am;collect(k);if(DB.depts[k].mgmtList.length>=12)return toast("Maximum reached",1);DB.depts[k].mgmtList.push({n:"",u:""});save();audit("Added Management slot "+k);tDepts()});
app.querySelectorAll("[data-dm]").forEach(b=>b.onclick=async()=>{const[k,i]=b.dataset.dm.split(":");if(DB.depts[k]&&await confirmD("Delete this Management entry?")){collect(k);DB.depts[k].mgmtList.splice(+i,1);if(!DB.depts[k].mgmtList.length)DB.depts[k].mgmtList.push({n:"",u:""});save();audit("Removed Management entry "+k);tDepts()}})}
function tNews(){
$("#tb").innerHTML=`<div class="card"><div class="form"><label class="f">Title<input id="nt" maxlength="80"></label><label class="f">Text<input id="nb" maxlength="300"></label></div><div class="err" id="ne"></div><button class="btn sm" id="an">Publish</button>
<table class="tbl" style="margin-top:14px"><tbody>${DB.news.map((n,i)=>`<tr><td data-l="Date">${esc(n.d)}</td><td data-l="Title">${esc(n.t)}</td><td><button class="btn danger sm" data-x="${i}">Delete</button></td></tr>`).join("")||"<tr><td>No announcements yet.</td></tr>"}</tbody></table></div>`;
$("#an").onclick=()=>{const t=clean($("#nt").value),b=clean($("#nb").value,300);if(!t)return $("#ne").textContent="Title is required.";DB.news.unshift({t,b,d:new Date().toLocaleDateString("en-GB")});DB.news=DB.news.slice(0,20);save();audit("Published announcement");toast("Published");tNews()};
app.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{if(await confirmD("Delete this announcement?")){DB.news.splice(+b.dataset.x,1);save();audit("Deleted announcement");toast("Deleted");tNews()}})}
function sanitize(v){const num=x=>{x=Number(x);if(!Number.isInteger(x)||x<0||x>999)throw 0;return x};
if(!v||!Array.isArray(v.ranks)||!Array.isArray(v.wings)||!v.depts||typeof v.depts!=="object")throw 0;
const wings=[...new Set(v.wings.map(w=>clean(w)).filter(w=>w&&w!=="*"))].slice(0,30);
const ranks=v.ranks.slice(0,30).map(r=>({name:clean(r.name),mdt:num(r.mdt),dispatch:num(r.dispatch),presence:num(r.presence),shift:num(r.shift),shiftDone:r.shiftDone?1:0,active:r.active?1:0,wings:(Array.isArray(r.wings)?r.wings:[]).map(w=>clean(w)).filter(w=>w==="*"||wings.includes(w))}));
if(!ranks.length||ranks.some(r=>!r.name))throw 0;
const depts={};for(const k of Object.keys(SEED.depts)){const d=v.depts[k]||SEED.depts[k],o={title:SEED.depts[k].title};["cmd","cmdUnit","dep","depUnit"].forEach(f=>o[f]=clean(d[f]));
o.mgmtList=SEED.depts[k].mgmtList.length?(Array.isArray(d.mgmtList)&&d.mgmtList.length?d.mgmtList:[{}]).slice(0,12).map(m=>({n:clean(m.n),u:clean(m.u)})):[];depts[k]=o}
const news=(Array.isArray(v.news)?v.news:[]).slice(0,20).map(n=>({t:clean(n.t),b:clean(n.b,300),d:clean(n.d,20)})).filter(n=>n.t);
return{wings,ranks,depts,news}}
function tBackup(){
$("#tb").innerHTML=`<div class="card"><p class="mu">Save a backup file to keep your data safe or move it to another browser.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn sm" id="ex">Export backup</button><label class="btn ghost sm" style="cursor:pointer">Import backup<input id="im" type="file" accept=".json,application/json" hidden></label></div></div>`;
$("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}));a.download="portal-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);audit("Exported backup")};
$("#im").onchange=e=>{const f=e.target.files[0];if(!f||f.size>1e6)return toast("Invalid backup file",1);const r=new FileReader();r.onload=async()=>{let v;try{v=sanitize(JSON.parse(r.result))}catch(x){return toast("Invalid backup file",1)}
if(await confirmD("Replace all current data with this backup?")){DB=v;save();audit("Imported backup");toast("Backup imported")}};r.readAsText(f)}}
function tLog(){let l=[];try{l=JSON.parse(localStorage.getItem(LKEY)||"[]")}catch(e){}
$("#tb").innerHTML=`<div class="card"><table class="tbl"><tbody>${l.map(x=>`<tr><td data-l="Time">${esc(x.t)}</td><td data-l="Action">${esc(x.a)}</td></tr>`).join("")||"<tr><td>No actions recorded yet.</td></tr>"}</tbody></table>
<button class="btn danger sm" id="rs" style="margin-top:14px">Reset all data to defaults</button></div>`;
$("#rs").onclick=async()=>{if(await confirmD("Reset every rank, wing and department to the defaults?")){DB=structuredClone(SEED);save();audit("Reset data");toast("Data reset");tLog()}}}
