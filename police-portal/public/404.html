<style>
:root{--bg:#050b1a;--bg2:#0a1530;--pan:#0c1a3a;--line:#1c3160;--tx:#eef1f7;--mu:#93a1bb;--ac:#e8cf55;--ac2:#14306e;--hair:#ffffff0d;--ease:cubic-bezier(.22,.8,.24,1)}
[data-mode=black]{--bg:#000;--bg2:#04060c;--pan:#070b15;--line:#15203a}
[data-mode=dim]{--bg:#0e1830;--bg2:#16254a;--pan:#1b2d58;--line:#33497e;--mu:#aab6cf}
[data-mode=soft]{--bg:#d9e0ee;--bg2:#e6ebf5;--pan:#f1f4fa;--line:#b7c3dc;--tx:#0f1b36;--mu:#4b5a7a;--ac:#9a7600;--ac2:#dfe7f7;--hair:#0000000d}
[data-mode=light]{--bg:#f4f6fb;--bg2:#e9edf6;--pan:#fff;--line:#c7d0e4;--tx:#0f1b36;--mu:#51607e;--ac:#9a7600;--ac2:#dfe7f7;--hair:#0000000d}
*{box-sizing:border-box;margin:0}
html{font-family:"Bahnschrift","Cairo","Segoe UI",Tahoma,"Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:28px 18px;color:var(--tx);line-height:1.8;overflow-x:hidden;background:radial-gradient(900px 560px at 85% -15%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 62%),radial-gradient(800px 560px at -5% 105%,color-mix(in srgb,var(--ac2) 60%,transparent),transparent 62%),linear-gradient(var(--hair) 1px,transparent 1px) 0 0/52px 52px,linear-gradient(90deg,var(--hair) 1px,transparent 1px) 0 0/52px 52px,var(--bg);transition:background-color .4s}
[dir=rtl] *{letter-spacing:0!important}
.c{width:min(100%,640px);text-align:center;padding:38px 36px 32px;border-radius:30px;border:1px solid color-mix(in srgb,var(--line) 80%,var(--ac) 20%);background:linear-gradient(180deg,color-mix(in srgb,var(--pan) 90%,#fff 10%),var(--pan));box-shadow:0 30px 80px -34px #000d,inset 0 1px 0 var(--hair);animation:in .7s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(22px) scale(.98)}}
@keyframes fl{50%{transform:translateY(-8px)}}
.seal{width:96px;height:96px;border-radius:50%;margin-bottom:6px;box-shadow:0 0 0 8px color-mix(in srgb,var(--ac) 10%,transparent),0 0 0 20px color-mix(in srgb,var(--ac) 5%,transparent),0 18px 40px -14px #000;animation:fl 5s ease-in-out infinite}
.n{display:block;font-size:clamp(4.8rem,18vw,7.6rem);font-weight:800;line-height:1.05;margin-top:8px;background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 35%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
h1{font-size:clamp(1.4rem,4vw,1.9rem);font-weight:800;margin:4px 0 8px}
p{color:var(--mu);max-width:44ch;margin:0 auto}
code{display:inline-block;direction:ltr;unicode-bidi:isolate;margin-top:14px;padding:3px 14px;border-radius:999px;border:1px dashed var(--line);color:var(--mu);font-size:.85rem;max-width:100%;overflow-wrap:anywhere}
.bt{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px 0 18px}
.b{display:inline-flex;align-items:center;justify-content:center;padding:13px 28px;border-radius:12px;font:inherit;font-weight:800;font-size:1rem;text-decoration:none;cursor:pointer;border:1px solid var(--line);color:var(--tx);background:color-mix(in srgb,var(--pan) 65%,transparent);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.b:hover{transform:translateY(-3px);border-color:var(--ac)}
.b.p{background:var(--ac);border-color:var(--ac);color:#0a0e14;box-shadow:0 12px 26px -12px var(--ac)}
[data-mode=light] .b.p,[data-mode=soft] .b.p{color:#fff}
.ch{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:20px;border-top:1px solid var(--line)}
.ch a{padding:7px 16px;border-radius:999px;font-size:.9rem;font-weight:700;text-decoration:none;color:var(--mu);border:1px solid var(--line);transition:all .25s}
.ch a:hover{color:var(--tx);border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.lg{position:fixed;top:16px;inset-inline-end:16px;z-index:5}
.lg button{font:inherit;font-weight:800;padding:8px 16px;border-radius:999px;cursor:pointer;color:var(--tx);border:1px solid var(--line);background:color-mix(in srgb,var(--pan) 80%,transparent);transition:border-color .2s}
.lg button:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:520px){.c{padding:34px 20px 30px;border-radius:24px}.b{flex:1 1 100%}}
</style></head>
